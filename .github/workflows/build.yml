name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f deployments/docker/Dockerfile -t tillegal-ai:${{ github.sha }} .
