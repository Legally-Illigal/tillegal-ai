name: Security

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Dependency and secret check
        run: |
          uv pip list --format=json
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path('.')
          patterns = ['API_KEY=', 'SECRET=', 'TOKEN=', 'PASSWORD=', 'BEGIN PRIVATE KEY']
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if path.suffix not in {'.py', '.yaml', '.yml', '.env', '.toml', '.json'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              hits = [p for p in patterns if p in text]
              if hits:
                  print(f'{path}: sensitive marker(s) {hits}')
          PY
