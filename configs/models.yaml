default_model: gpt-4o-mini

providers:
  openai:
    enabled: true
    api_key_env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    timeout_seconds: 60

  anthropic:
    enabled: false
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-3-haiku-20240307
    timeout_seconds: 60

profiles:
  legal_fast:
    provider: openai
    model: gpt-4o-mini
    temperature: 0.2
  legal_strict:
    provider: openai
    model: gpt-4o
    temperature: 0.1
